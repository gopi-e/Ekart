name: Java Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Generate a short tag (First 7 characters of SHA)
      - name: Set Image Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 2. Set up JDK environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Run Maven Clean Install
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build the Docker image using the dynamic tag
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          # We use both 'latest' and the unique SHA tag
          tags: |
            my-java-app:latest
            my-java-app:${{ steps.vars.outputs.tag }}

      # 6. Print the image name and tag
      - name: Print Image Details
        run: |
          echo "----------------------------------------------"
          echo "Successfully built image:"
          echo "my-java-app:${{ steps.vars.outputs.tag }}"
          echo "----------------------------------------------"
