name: Java Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Generate the Short SHA tag
      - name: Set Image Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 2. Set up JDK & Build Artifact
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      # 3. Docker Login (Required if you want to push later)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build the Docker image with your name/tag
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false # Set to true once you enable the login step above
          tags: |
            adijaiswal/ekart:latest
            adijaiswal/ekart:${{ steps.vars.outputs.tag }}

      # 5. Print the image name and tag
      - name: Print Image Details
        run: |
          echo "Build Complete!"
          echo "Primary Image: adijaiswal/ekart:latest"
          echo "Versioned Image: adijaiswal/ekart:${{ steps.vars.outputs.tag }}"
      # 6. Update the Deployment YAML

      - name: Update Deployment Tag

        run: |

          # Use sed to find the image line and replace the tag with the new SHA

          sed -i "s|image: adijaiswal/ekart:.*|image: adijaiswal/ekart:${{ steps.vars.outputs.tag }}|g" deploymentservice.yml          

         
